<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgFill" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151033"/>
    </linearGradient>
    <linearGradient id="burst" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CF6FF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bgFill)"/>

    <!-- Speed-line energy slashes -->
    <g stroke="url(#burst)" stroke-linecap="round" opacity="0.6">
      <path d="M -40 400 L 300 60" stroke-width="24"/>
      <path d="M -20 460 L 360 100" stroke-width="14" opacity="0.6"/>
    </g>

    <!-- Glow behind play button -->
    <circle cx="256" cy="256" r="190" fill="url(#burst)" opacity="0.25"/>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#burst)" stroke-width="6" opacity="0.6"/>

  <!-- Bold play triangle -->
  <path d="M 200 150 L 200 362 L 388 256 Z" fill="url(#accent)"/>
</svg>